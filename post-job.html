<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnify - Post a Job</title>
    <link rel="stylesheet" href="css/style.css?v=20260929">
</head>
<body>
    <header>
        <div class="logo">Earnify</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="#" id="nav-logout">Logout</a>
        </nav>
    </header>

    <main class="post-job-container">
        <div class="card">
            <h2>Post a New Job</h2>
            <form id="post-job-form">
                <input type="text" id="company-name" placeholder="Organization / Campus Group Name" required>
                <input type="text" id="job-title" placeholder="Task Title" required>
                <textarea id="job-desc" placeholder="Task Description" required></textarea>
                <select id="job-category" required>
                    <option value="Local">Campus & Local Gig</option>
                    <option value="Online">Remote Task</option>
                </select>
                <select id="task-category" required>
                    <option value="Tutoring">Tutoring</option>
                    <option value="Campus Support">Campus Support</option>
                    <option value="Delivery">Delivery / Errand</option>
                    <option value="Design">Design / Social Media</option>
                    <option value="Data Entry">Data Entry</option>
                    <option value="Event Help">Event Help</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="job-location" placeholder="Location / Campus / Area">
                <select id="job-type" required>
                    <option value="Part-time">Part-time</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Campus Gig">Campus Gig</option>
                    <option value="Errand">Errand / Delivery</option>
                </select>
                <input type="text" id="job-payment" placeholder="Pay / Compensation" required>
                <input type="text" id="required-skills" placeholder="Skills needed (comma separated)">
                <select id="job-urgency" required>
                    <option value="Normal">Normal</option>
                    <option value="Flexible">Flexible</option>
                    <option value="Urgent">Urgent</option>
                </select>
                <button type="submit" class="btn">Post Task</button>
            </form>
            <p id="post-message" class="message"></p>
        </div>
    </main>

    <script type="module" src="js/post-job.js"></script>
</body>
</html>
